<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Plot Detail</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = supabase.createClient(
  "https://befmtxcrblgtmsvwjieh.supabase.co",
  "sb_publishable_Or_PZwo-9lO--5PIHhmvwA_omV5Sg0O"
);
</script>
</head>

<body class="bg-gray-100 flex justify-center">
<div class="w-full max-w-sm h-screen bg-gray-50 flex flex-col">

<nav class="bg-white shadow p-4 flex items-center">
  <a href="my-plots.html"><i class="ph ph-arrow-left text-2xl"></i></a>
  <h1 id="plotName" class="ml-4 font-bold text-green-700">Plot</h1>
</nav>

<main class="flex-grow overflow-y-auto p-4 space-y-4">

<div id="activeCrop"></div>

<button onclick="startCycle()" class="w-full bg-green-600 text-white p-3 rounded">
Start New Crop Cycle
</button>

<h3 class="font-bold mt-4">Activities</h3>
<div id="activityList" class="space-y-2"></div>

<button onclick="addActivity()" class="w-full bg-blue-600 text-white p-3 rounded">
Add Activity
</button>

<h3 class="font-bold mt-4">Crop History</h3>
<div id="historyList"></div>

</main>
</div>

<script>
const plotId = localStorage.getItem("plot_id");

async function loadPlot(){
  const {data} = await supabase.from("plots").select("*").eq("id",plotId).single();
  plotName.textContent = data.name;
}

async function loadCrop(){
  const {data} = await supabase
    .from("crops")
    .select("*")
    .eq("plot_id", plotId)
    .eq("status","active")
    .single();

  if(!data){
    activeCrop.innerHTML = "<p>No active crop</p>";
    return;
  }

  activeCrop.innerHTML = `
    <div class="bg-white p-3 rounded shadow">
      <h3 class="font-bold text-green-700">${data.name}</h3>
      <p>${data.variety || ""}</p>
      <p>Sown on: ${data.sowing_date}</p>
      <button onclick="harvest('${data.id}')" class="bg-yellow-500 text-white p-2 mt-2 rounded">
        Harvest
      </button>
    </div>
  `;

  loadActivities(data.id);
}

async function startCycle(){
  const name = prompt("Crop name?");
  const variety = prompt("Variety?");
  const date = prompt("Sowing date (YYYY-MM-DD)");

  await supabase.from("crops").insert({
    plot_id: plotId,
    name,
    variety,
    sowing_date: date,
    status:"active"
  });

  loadCrop();
}

async function harvest(id){
  await supabase.from("crops").update({status:"harvested"}).eq("id",id);
  loadCrop();
  loadHistory();
}

async function loadActivities(cropId){
  const {data} = await supabase.from("activities").select("*").eq("crop_id",cropId);
  activityList.innerHTML="";
  data.forEach(a=>{
    activityList.innerHTML+=`
      <div class="bg-white p-2 rounded">
        <b>${a.type}</b> – ${a.date}
      </div>
    `;
  });
}

async function addActivity(){
  const {data} = await supabase.from("crops").select("id").eq("plot_id",plotId).eq("status","active").single();
  if(!data) return alert("No active crop");

  const type = prompt("Activity type?");
  const date = prompt("Date (YYYY-MM-DD)");

  await supabase.from("activities").insert({
    crop_id: data.id,
    type,
    date
  });

  loadActivities(data.id);
}

async function loadHistory(){
  const {data} = await supabase.from("crops").select("*").eq("plot_id",plotId).eq("status","harvested");
  historyList.innerHTML="";
  data.forEach(c=>{
    historyList.innerHTML+=`<p>${c.name} – ${c.sowing_date}</p>`;
  });
}

loadPlot();
loadCrop();
loadHistory();
</script>

</body>
</html>
