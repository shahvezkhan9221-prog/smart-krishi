<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Plots - SmartKrishi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabase = supabase.createClient(
  "https://befmtxcrblgtmsvwjieh.supabase.co",
  "sb_publishable_Or_PZwo-9lO--5PIHhmvwA_omV5Sg0O"
);
</script>
</head>

<body class="bg-gray-100 flex justify-center">
<div class="w-full max-w-sm h-screen bg-gray-50 flex flex-col">

<!-- Header -->
<nav class="bg-white shadow p-4 flex items-center">
  <a href="index.html">
    <i class="ph ph-arrow-left text-2xl text-gray-600"></i>
  </a>
  <h1 class="ml-4 text-xl font-bold text-green-700">My Plots</h1>
</nav>

<!-- Content -->
<main class="flex-grow overflow-y-auto p-4 space-y-4">

<div id="plotsContainer"></div>

<button onclick="addPlot()" 
  class="fixed bottom-6 right-6 bg-green-600 text-white p-4 rounded-full shadow-lg">
  <i class="ph ph-plus text-2xl"></i>
</button>

</main>
</div>

<script>
let userId = localStorage.getItem("user_id");
if(!userId){
  userId = crypto.randomUUID();
  localStorage.setItem("user_id", userId);
}

async function loadPlots(){
  const { data, error } = await supabase
    .from("plots")
    .select("*")
    .eq("user_id", userId)
    .order("created_at", { ascending: false });

  const container = document.getElementById("plotsContainer");
  container.innerHTML = "";

  if(!data || data.length === 0){
    container.innerHTML = `
      <div class="text-center text-gray-500 mt-20">
        <i class="ph ph-plant text-5xl"></i>
        <p class="mt-3">No plots added yet</p>
      </div>`;
    return;
  }

  data.forEach(plot => {
    container.innerHTML += `
      <div onclick="openPlot('${plot.id}')"
        class="bg-white p-4 rounded-xl shadow cursor-pointer hover:bg-gray-50">
        <h3 class="text-lg font-bold text-green-700">${plot.name}</h3>
        <p class="text-gray-600 text-sm">Area: ${plot.area}</p>
        <p class="text-gray-600 text-sm">Soil: ${plot.soil}</p>
      </div>
    `;
  });
}

function openPlot(id){
  localStorage.setItem("plot_id", id);
  window.location.href = "plot-detail.html";
}

async function addPlot(){
  const name = prompt("Plot name?");
  if(!name) return;

  const area = prompt("Area (e.g. 2 acres)");
  const soil = prompt("Soil type");

  await supabase.from("plots").insert({
    user_id: userId,
    name,
    area,
    soil,
    created_at: new Date()
  });

  loadPlots();
}

loadPlots();
</script>

</body>
</html>
